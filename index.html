<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<body>
<div class="wrap"><canvas id="game"></canvas></div>
<script>
// ════════════════════════════════════════════════════════
//  NICOLE'S PICTURE POKER — Gothic Edition (Graveyard)
//  Canvas: 800 × 600
// ════════════════════════════════════════════════════════

const W = 800, H = 600;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);


const F_GOTHIC      = '"MedievalSharp", "Pirata One", serif';
const F_BLACKLETTER = '"UnifrakturMaguntia", "UnifrakturCook", "MedievalSharp", serif';

// ── Card characters (6 suits, ordered low → high) ───────────────────────────
// Suit hierarchy: rat(1) < potion(2) < helmet(3) < carriage(4) < goblet(5) < jewel(6)
const CHARS = ['rat', 'potion', 'helmet', 'carriage', 'goblet', 'jewel'];
const CHAR_META = {
  rat:      { label: 'Rat',      color: '#9a9aa3', dark: '#5a5a64', suitRank: 1 },
  potion:   { label: 'Potion',   color: '#7eb650', dark: '#3e6a26', suitRank: 2 },
  helmet:   { label: 'Helm',     color: '#5a8ad6', dark: '#2c4880', suitRank: 3 },
  carriage: { label: 'Carriage', color: '#b04250', dark: '#5a1c26', suitRank: 4 },
  goblet:   { label: 'Goblet',   color: '#d2a043', dark: '#8a6418', suitRank: 5 },
  jewel:    { label: 'Jewel',    color: '#a040d8', dark: '#5e1e8c', suitRank: 6 },
};

const HAND_RANKINGS = [
  { name: 'Five of a Kind',  mult: 200, index: 0 },
  { name: 'Four of a Kind',  mult: 25,  index: 1 },
  { name: 'Full House',      mult: 8,   index: 2 },
  { name: 'Three of a Kind', mult: 4,   index: 3 },
  { name: 'Two Pair',        mult: 2,   index: 4 },
  { name: 'One Pair',        mult: 1,   index: 5 },
  { name: 'No Match',        mult: 0,   index: 6 },
];

// ── Layout ─────────────────────────────────────────────────────────────────
// Two-plane scene: graveyard above the table horizon, felt below.
const TABLE_TOP_Y  = 134;                 // top of wooden table edge
const TABLE_EDGE_H = 8;                   // wood-edge strip height
const TABLE_FELT_Y = TABLE_TOP_Y + TABLE_EDGE_H; // 142 — felt + pay table start

const PT_W   = 148;
const MAIN_X = PT_W;
const MAIN_W = W - PT_W;
const MAIN_CX = MAIN_X + Math.round(MAIN_W / 2);

const CARD_W = 80, CARD_H = 110, CARD_GAP = 14;
const CARDS_SPAN = 5 * CARD_W + 4 * CARD_GAP;
const CARD_X0 = MAIN_X + Math.round((MAIN_W - CARDS_SPAN) / 2);
const CARD_COLS = [0,1,2,3,4].map(i => CARD_X0 + i * (CARD_W + CARD_GAP));

const DEALER_Y  = 180;   // dealer card top y — shifted down 10px to give room for the hand-rank label
const PLAYER_Y  = 390;
const HOLD_LIFT = 12;

const DIV1_Y = 296;
const DIV2_Y = 380;
const DIV3_Y = 513;
const ACTION_CY = Math.round((DIV1_Y + DIV2_Y) / 2);  // 338

const HOLD_BTN = { x: MAIN_CX - 90, y: ACTION_CY - 24, w: 180, h: 48 };
const GAMEOVER_BTN = { x: MAIN_CX - 80, y: ACTION_CY - 21, w: 160, h: 42 };
const BTN = {
  deal: { x: MAIN_CX - 43, y: 553, w: 86, h: 36 },
};
// Wager control group — left-aligned at x=158, numbers grow rightward
//   [All In]
//    10
//    wager
//   [10%] [25%] [50%]
const BW_X     = 158;
const BW_ALLIN = { x: BW_X, y: 514, w: 70, h: 22 };
const BW_PCT   = [
  { x: BW_X,       y: 572, w: 50, h: 22, pct: 0.10, label: '10%' },
  { x: BW_X + 56,  y: 572, w: 50, h: 22, pct: 0.25, label: '25%' },
  { x: BW_X + 112, y: 572, w: 50, h: 22, pct: 0.50, label: '50%' },
];

// Pixel-art scale used for graveyard / dealer / crows
const PX = 3;

// ── Audio ──────────────────────────────────────────────────────────────────
let audioCtx = null;
function ensureAudio() { if (!audioCtx) try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
function playTone(freq, dur, type='square', vol=0.06) {
  try {
    ensureAudio(); if (!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxClick()  { playTone(220, 0.05, 'sine', 0.04); }
function sfxDeal()   { for(let i=0;i<5;i++) setTimeout(()=>playTone(180+i*30,0.08,'triangle',0.05),i*70); }
function sfxHold()   { playTone(165, 0.10, 'sine', 0.05); setTimeout(()=>playTone(247,0.08,'sine',0.04),60); }
function sfxFlip()   { for(let i=0;i<5;i++) setTimeout(()=>playTone(120+i*40,0.06,'triangle',0.04),i*60); }
function sfxWin()    { [261,329,392,523].forEach((f,i)=>setTimeout(()=>playTone(f,0.18,'square',0.05),i*120)); }
function sfxBigWin() { [220,261,329,392,523,659].forEach((f,i)=>setTimeout(()=>playTone(f,0.2,'square',0.06),i*100)); }
function sfxLoss()   { [200,160,120,90].forEach((f,i)=>setTimeout(()=>playTone(f,0.22,'sawtooth',0.05),i*110)); }
function sfxPush()   { playTone(196, 0.18, 'sine', 0.045); }

// ── Number formatting ──────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1e11) {
    const exp = Math.floor(Math.log10(n));
    const mantissa = n / Math.pow(10, exp);
    return `${mantissa.toFixed(2)}e${exp}`;
  }
  return Math.round(n).toLocaleString('en-US');
}

// ── Deck & Logic ───────────────────────────────────────────────────────────
// 60-card deck: 10 copies of each of 6 suits. Cards are {char} objects.
function buildDeck() {
  const d = [];
  for (const c of CHARS) for (let i = 0; i < 10; i++) d.push({ char: c });
  return d;
}
function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}
// Hands are evaluated by matching suits (chars). Ties broken by suit hierarchy.
function evaluateHand(cards) {
  const c={}; for (const x of cards) c[x.char]=(c[x.char]||0)+1;
  const v=Object.values(c).sort((a,b)=>b-a);
  if (v[0]===5)             return HAND_RANKINGS[0];
  if (v[0]===4)             return HAND_RANKINGS[1];
  if (v[0]===3&&v[1]===2)   return HAND_RANKINGS[2];
  if (v[0]===3)             return HAND_RANKINGS[3];
  if (v[0]===2&&v[1]===2)   return HAND_RANKINGS[4];
  if (v[0]===2)             return HAND_RANKINGS[5];
  return HAND_RANKINGS[6];
}
function getScoringIndices(cards) {
  const c={}; for (const x of cards) c[x.char]=(c[x.char]||0)+1;
  const set=new Set(); for (const k in c) if (c[k]>=2) set.add(k);
  const out=[]; for (let i=0;i<cards.length;i++) if (set.has(cards[i].char)) out.push(i);
  return out;
}
// Compare two same-tier hands by suit hierarchy.
// Groups suits by count (desc) then by suitRank (desc), then compares lexicographically.
// Returns 1 if hand1 wins, -1 if hand2 wins, 0 if true tie.
function compareSuitTiebreak(hand1, hand2) {
  function groups(cards) {
    const c={};
    for (const x of cards) c[x.char]=(c[x.char]||0)+1;
    return Object.entries(c)
      .map(([char, count]) => ({ count, sr: CHAR_META[char].suitRank }))
      .sort((a,b) => b.count!==a.count ? b.count-a.count : b.sr-a.sr);
  }
  const g1=groups(hand1), g2=groups(hand2);
  for (let i=0; i<Math.max(g1.length,g2.length); i++) {
    const a=g1[i], b=g2[i];
    if (!a) return -1; if (!b) return 1;
    if (a.count!==b.count) return a.count>b.count ? 1 : -1;
    if (a.sr!==b.sr) return a.sr>b.sr ? 1 : -1;
  }
  return 0;
}
// Returns the desired slot order on reveal — matched groups first (largest → smallest),
// preserving original index order within each group. Singletons trail at the end.
function arrangeForReveal(cards) {
  const groups = {};
  cards.forEach((c, i) => {
    if (!groups[c.char]) groups[c.char] = [];
    groups[c.char].push(i);
  });
  const sorted = Object.values(groups).sort((a, b) => {
    if (b.length !== a.length) return b.length - a.length;
    return a[0] - b[0]; // tiebreak: earlier appearance first
  });
  const order = [];
  for (const g of sorted) for (const i of g) order.push(i);
  return order;
}
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}
// Crossfade state for a single card during the 'dealerDraw' phase. Held cards skip
// the animation. Each non-held card is staggered by 3 frames to give the swap a wave.
function getCardReplaceState(i, isPlayerHand) {
  if (state.phase !== 'dealerDraw') return { useOld: false, alpha: 1 };
  const held = isPlayerHand ? state.heldCards[i] : state.dealerHeld[i];
  if (held) return { useOld: false, alpha: 1 };
  const stagger = i * 3;
  const localF  = state.drawFrame - stagger;
  const halfDur = 12;
  if (localF < 0)              return { useOld: true,  alpha: 1 };
  if (localF < halfDur)        return { useOld: true,  alpha: 1 - localF / halfDur };
  if (localF < halfDur * 2)    return { useOld: false, alpha: (localF - halfDur) / halfDur };
  return { useOld: false, alpha: 1 };
}

// Returns { scaleX, showFace } for a card being flipped from back→face.
// cardIndex 0-4, stagger of DEAL_FLIP_STAGGER frames between cards.
const DEAL_FLIP_STAGGER = 7;
const DEAL_FLIP_HALF    = 12;  // frames for each half of the flip
function getDealFlipState(cardIndex) {
  const f = state.dealFlipFrame - cardIndex * DEAL_FLIP_STAGGER;
  const total = DEAL_FLIP_HALF * 2;
  if (f <= 0)       return { scaleX: 1, showFace: false };   // not started — show back
  if (f >= total)   return { scaleX: 1, showFace: true };    // done — show face
  if (f < DEAL_FLIP_HALF) {
    // First half: back card, scale 1→0
    return { scaleX: 1 - f / DEAL_FLIP_HALF, showFace: false };
  }
  // Second half: face card, scale 0→1
  return { scaleX: (f - DEAL_FLIP_HALF) / DEAL_FLIP_HALF, showFace: true };
}
function getDealerRevealFlipState(cardIndex) {
  const f = state.dealerRevealFlipFrame - cardIndex * DEAL_FLIP_STAGGER;
  const total = DEAL_FLIP_HALF * 2;
  if (f <= 0)       return { scaleX: 1, showFace: false };
  if (f >= total)   return { scaleX: 1, showFace: true };
  if (f < DEAL_FLIP_HALF) {
    return { scaleX: 1 - f / DEAL_FLIP_HALF, showFace: false };
  }
  return { scaleX: (f - DEAL_FLIP_HALF) / DEAL_FLIP_HALF, showFace: true };
}
// Flip state for player new cards — uses same dealerRevealFlipFrame but no
// per-card stagger, so all new player cards flip simultaneously with dealer card 0.
function getNewCardRevealFlipState() {
  const f = state.dealerRevealFlipFrame;
  const total = DEAL_FLIP_HALF * 2;
  if (f <= 0)       return { scaleX: 1, showFace: false };
  if (f >= total)   return { scaleX: 1, showFace: true };
  if (f < DEAL_FLIP_HALF) return { scaleX: 1 - f / DEAL_FLIP_HALF, showFace: false };
  return { scaleX: (f - DEAL_FLIP_HALF) / DEAL_FLIP_HALF, showFace: true };
}

// ── Game State ─────────────────────────────────────────────────────────────
const state = {
  phase: 'bet',                         // 'bet' | 'hold' | 'dealerHold' | 'dealerDraw' | 'result' | 'gameOver'
  coins: 100, bet: 10, highCoinCount: 100,
  dealerCards: [], playerCards: [],
  oldPlayerCards: [], oldDealerCards: [],   // pre-replacement snapshot (for crossfade)
  heldCards:   [false,false,false,false,false],
  dealerHeld:  [false,false,false,false,false],
  dealerRevealed: false,
  playerHandRank: null, dealerHandRank: null,
  playerScoring: [], dealerScoring: [],
  resultMessage: '', resultIsWin: false, resultIsPush: false,
  animFrame: 0,
  dealerAnim: 'idle',
  dealerAnimFrame: 0,
  dealerHoldFrame: 0,                  // ticks up while dealer is "thinking"
  drawFrame: 0,                        // ticks up while non-held cards crossfade
  revealFrame: 0,                      // ticks up while in result phase
  playerOrder: [0,1,2,3,4],            // arranged slot order on reveal
  dealerOrder: [0,1,2,3,4],
  brokeAfterResult: false,
  dealFlipFrame: 99,  // start at max so empty bet-phase slots show as outlines, not card backs
  dealerRevealFlipFrame: 0,
  flyCards: [],
  playerNewCards: [false,false,false,false,false],  // slots replaced this round (revealed at end)
};
const REVEAL_DUR      = 50;            // frames for card-grouping animation
const DEALER_HOLD_DUR = 180;           // 3 sec at 60 fps for the dealer's decision
const DRAW_DUR        = 42;            // ~0.7 sec for the replacement crossfade
const FLY_DUR     = 52;   // frames for a card to travel from source to slot
const FLY_STAGGER = 14;   // frames between successive cards departing
const FLY_FLIP    = 24;   // frames for the face-up flip after landing

// Win confetti particles
let particles = [];
function spawnWinParticles() {
  const colors = ['#7eb650','#d2a043','#a89eb8','#7a96b4','#9a9aa3','#b04250'];
  for (let i=0;i<55;i++) {
    const ml=80+Math.floor(Math.random()*80);
    particles.push({
      x: MAIN_X + 20 + Math.random()*(MAIN_W-40),
      y: 80 + Math.random()*350,
      vx: (Math.random()-0.5)*4,
      vy: -1.5 - Math.random()*3,
      life: ml, maxLife: ml,
      color: colors[i%colors.length], r: 2 + Math.random()*3,
    });
  }
}

// Ambient drifting embers (above the table only, for atmosphere)
const ambient = [];
for (let i=0;i<14;i++) {
  ambient.push({
    x: Math.random()*W, y: Math.random()*TABLE_TOP_Y,
    vx: (Math.random()-0.5)*0.18,
    vy: -0.06 - Math.random()*0.16,
    r: 0.5 + Math.random()*1.2,
    alpha: 0.08 + Math.random()*0.16,
    flick: Math.random()*Math.PI*2,
  });
}

// Crows
const crows = [];
function spawnCrow() {
  const dir = Math.random() < 0.5 ? 1 : -1;
  const speed = 0.55 + Math.random()*0.5;
  crows.push({
    x: dir > 0 ? -10 : W + 10,
    y: 18 + Math.random()*70,
    vx: dir * speed,
    vy: (Math.random()-0.5)*0.05,
    flap: Math.random()*Math.PI*2,
    flapSpeed: 0.18 + Math.random()*0.12,
    dir,
  });
}
// Seed a couple at startup
spawnCrow(); spawnCrow();

// ── Mouse ──────────────────────────────────────────────────────────────────
let mouseX=0, mouseY=0, mouseClicked=false;
function getPos(e) {
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height)};
}
function inRect(mx,my,x,y,w,h) { return mx>=x&&mx<=x+w&&my>=y&&my<=y+h; }
canvas.addEventListener('mousemove',e=>{const p=getPos(e);mouseX=p.x;mouseY=p.y;});
canvas.addEventListener('click',e=>{ensureAudio();const p=getPos(e);mouseX=p.x;mouseY=p.y;mouseClicked=true;});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  ensureAudio();
  if (e.touches.length>0) { const p=getPos(e.touches[0]); mouseX=p.x; mouseY=p.y; mouseClicked=true; }
}, {passive:false});

// ── Game Actions ───────────────────────────────────────────────────────────
function doDeal() {
  const deck = shuffle(buildDeck());
  state.dealerCards    = deck.slice(0,5);
  state.playerCards    = deck.slice(5,10);
  state.heldCards      = [false,false,false,false,false];
  state.dealerHeld     = [false,false,false,false,false];
  state.dealerRevealed = false;
  state.playerHandRank = null;    // evaluated when initial-deal flying cards land
  state.dealerHandRank = null;
  state.playerScoring  = [];
  state.dealerScoring  = [];
  state.dealerAnim = 'dealing';
  state.dealerAnimFrame = 0;
  state.dealerHoldFrame = 0;
  state.drawFrame = 0;
  state.oldPlayerCards = [];
  state.oldDealerCards = [];
  state.playerOrder = [0,1,2,3,4];
  state.dealerOrder = [0,1,2,3,4];
  state.revealFrame = 0;
  // Cards fly in face-up, so skip the back→face flip by starting dealFlipFrame at max
  state.dealFlipFrame = DEAL_FLIP_STAGGER * 4 + DEAL_FLIP_HALF * 2 + 5;
  state.dealerRevealFlipFrame = 0;
  state.playerNewCards = [false,false,false,false,false];
  particles = [];

  // Launch all 5 player cards as face-up flying cards from the dealer
  state.flyCards = [];
  const srcX = MAIN_CX;
  const srcY  = TABLE_FELT_Y + 5;
  for (let i = 0; i < 5; i++) {
    const card = state.playerCards[i];
    state.flyCards.push({
      char: card.char, slotIndex: i, isDealer: false, faceUp: true,
      sx: srcX, sy: srcY,
      tx: CARD_COLS[i] + CARD_W / 2, ty: PLAYER_Y + CARD_H / 2,
      startFrame: i * FLY_STAGGER,
      frame: 0, landed: false, flipFrame: 0,
    });
  }
  state.phase = 'initialDeal';
}
// Dealer's AI: hold every card that's already part of a matching group
// (any pair-or-better). Triggered when the player confirms their holds.
function doStartDealerHold() {
  const scoring = getScoringIndices(state.dealerCards);
  state.dealerHeld = [false,false,false,false,false];
  for (const i of scoring) state.dealerHeld[i] = true;
  state.dealerHoldFrame = 0;
}

// Replace non-held PLAYER cards and launch them as flying cards.
function doPlayerDraw() {
  const pool = buildDeck();
  for (let i = 0; i < 5; i++) {
    if (state.heldCards[i]) {
      const idx = pool.findIndex(c => c.char === state.playerCards[i].char);
      if (idx !== -1) pool.splice(idx, 1);
    }
  }
  shuffle(pool);
  let di = 0;
  state.flyCards = [];
  state.playerNewCards = [false,false,false,false,false];
  const srcX = MAIN_CX;
  const srcY = TABLE_FELT_Y + 5;
  for (let i = 0; i < 5; i++) {
    if (!state.heldCards[i]) {
      const newCard = pool[di++];
      state.playerCards[i] = newCard;
      state.playerNewCards[i] = true;
      state.flyCards.push({
        char: newCard.char, slotIndex: i, isDealer: false, faceUp: false,
        sx: srcX, sy: srcY,
        tx: CARD_COLS[i] + CARD_W / 2, ty: PLAYER_Y + CARD_H / 2,
        startFrame: i * FLY_STAGGER,
        frame: 0, landed: false, flipFrame: 0,
      });
    }
  }
  state.dealerAnim = 'dealing'; state.dealerAnimFrame = 0;
  sfxDeal();
}

// Replace non-held DEALER cards and launch them as flying cards.
function doDealerFly() {
  const pool = buildDeck();
  for (let i = 0; i < 5; i++) {
    if (state.heldCards[i]) {
      const idx = pool.findIndex(c => c.char === state.playerCards[i].char);
      if (idx !== -1) pool.splice(idx, 1);
    }
    if (state.dealerHeld[i]) {
      const idx = pool.findIndex(c => c.char === state.dealerCards[i].char);
      if (idx !== -1) pool.splice(idx, 1);
    }
  }
  shuffle(pool);
  let di = 0;
  state.flyCards = [];
  const srcX = MAIN_CX;
  const srcY = TABLE_FELT_Y + 5;
  for (let i = 0; i < 5; i++) {
    if (!state.dealerHeld[i]) {
      const newCard = pool[di++];
      state.dealerCards[i] = newCard;
      state.flyCards.push({
        char: newCard.char, slotIndex: i, isDealer: true, faceUp: false,
        sx: srcX, sy: srcY,
        tx: CARD_COLS[i] + CARD_W / 2, ty: DEALER_Y + CARD_H / 2,
        startFrame: i * FLY_STAGGER,
        frame: 0, landed: false, flipFrame: 0,
      });
    }
  }
  state.dealerAnim = 'dealing'; state.dealerAnimFrame = 0;
  sfxDeal();
}

// Snapshot the current cards (so we can crossfade old → new), then swap in new cards
// from a single shared pool. Triggers the dealer's "dealing" animation again.
function doStartDealerDraw() {
  state.oldPlayerCards = state.playerCards.map(c => ({ ...c }));
  state.oldDealerCards = state.dealerCards.map(c => ({ ...c }));

  const pool = buildDeck();
  for (let i=0;i<5;i++) {
    if (state.heldCards[i]) {
      const idx = pool.findIndex(c => c.char === state.playerCards[i].char);
      if (idx !== -1) pool.splice(idx, 1);
    }
    if (state.dealerHeld[i]) {
      const idx = pool.findIndex(c => c.char === state.dealerCards[i].char);
      if (idx !== -1) pool.splice(idx, 1);
    }
  }
  shuffle(pool);
  let di = 0;
  for (let i=0;i<5;i++) { if (!state.heldCards[i])  state.playerCards[i] = pool[di++]; }
  for (let i=0;i<5;i++) { if (!state.dealerHeld[i]) state.dealerCards[i] = pool[di++]; }

  state.dealerAnim      = 'dealing';
  state.dealerAnimFrame = 0;
  state.drawFrame       = 0;
  sfxDeal();
}

// Compute final hand ranks and trigger the reveal (flip + grouping) animation.
function doFinalizeReveal() {
  state.playerHandRank = evaluateHand(state.playerCards);
  state.dealerHandRank = evaluateHand(state.dealerCards);
  state.playerScoring  = getScoringIndices(state.playerCards);
  state.dealerScoring  = getScoringIndices(state.dealerCards);
  state.dealerRevealed = true;
  state.dealerAnim     = 'revealing';
  state.dealerAnimFrame = 0;
  state.playerOrder = arrangeForReveal(state.playerCards);
  state.dealerOrder = arrangeForReveal(state.dealerCards);
  state.revealFrame = 0;
  sfxFlip();
}
function doResolve() {
  const pr=state.playerHandRank, dr=state.dealerHandRank;
  // Determine winner: first compare hand tier, then break ties by suit hierarchy
  let playerWins=false, isDraw=false;
  let tieNote='';
  if (pr.index < dr.index) {
    playerWins=true;
  } else if (pr.index > dr.index) {
    playerWins=false;
  } else if (pr.index === 6) {
    // Both No Match — dealer always wins (no suit comparison)
    playerWins=false;
  } else {
    // Same hand tier — break tie by suit value
    const cmp = compareSuitTiebreak(state.playerCards, state.dealerCards);
    if (cmp > 0)      { playerWins=true; tieNote=' (higher suit)'; }
    else if (cmp < 0) { playerWins=false; tieNote=' (higher suit)'; }
    else              { isDraw=true; }
  }

  if (playerWins) {
    const w = state.bet * pr.mult;
    state.coins += w;
    state.highCoinCount = Math.max(state.highCoinCount, state.coins);
    state.resultIsWin=true; state.resultIsPush=false;
    state.resultMessage = pr.mult>1
      ? `${pr.name}  ×${pr.mult}  =  +${w} coins!${tieNote}`
      : `${pr.name}  ×1  —  bet returned${tieNote}`;
    spawnWinParticles();
    pr.mult>=25 ? sfxBigWin() : sfxWin();
  } else if (isDraw) {
    state.coins += state.bet;
    state.highCoinCount = Math.max(state.highCoinCount, state.coins);
    state.resultIsWin=false; state.resultIsPush=true;
    state.resultMessage = `Tie — ${pr.name} — bet returned`;
    sfxPush();
  } else {
    state.resultIsWin=false; state.resultIsPush=false;
    state.resultMessage = (pr.index===dr.index && pr.index!==6)
      ? `${dr.name} — dealer's suit wins${tieNote}`
      : pr.index===6
        ? `Both No Match — dealer wins`
        : `Dealer: ${dr.name} beats ${pr.name}`;
    sfxLoss();
  }
  if (state.coins < 5) {
    state.brokeAfterResult = true;
  }
  // If the player can no longer cover their current wager, drop it to what they have.
  if (state.bet > state.coins) {
    state.bet = state.coins;
  }
}
function doAutoReset() {
  state.phase='bet';
  state.dealerCards=[]; state.playerCards=[];
  state.heldCards=[false,false,false,false,false];
  state.dealerHeld=[false,false,false,false,false];
  state.dealerRevealed=false;
  state.playerHandRank=null; state.dealerHandRank=null;
  state.playerScoring=[]; state.dealerScoring=[];
  state.playerOrder=[0,1,2,3,4]; state.dealerOrder=[0,1,2,3,4];
  state.revealFrame=0;
  state.dealerHoldFrame=0;
  state.drawFrame=0;
  state.oldPlayerCards=[]; state.oldDealerCards=[];
  state.bet=Math.min(state.bet, state.coins);
  if (state.bet<10) state.bet=10;
  state.dealFlipFrame=99;  // max — empty slots show as outlines in bet phase
  state.dealerRevealFlipFrame=0;
  state.flyCards=[];
  state.playerNewCards=[false,false,false,false,false];
  particles=[];
}
function doHardReset() {
  doAutoReset();
  state.coins = 100;
  state.bet = 10;
  state.highCoinCount = 100;
  state.brokeAfterResult = false;
}

// ── Click Handling ─────────────────────────────────────────────────────────
function handleClicks() {
  if (!mouseClicked) return;
  mouseClicked=false;

  if (state.phase==='bet') {
    const {deal}=BTN;
    if (inRect(mouseX,mouseY,BW_ALLIN.x,BW_ALLIN.y,BW_ALLIN.w,BW_ALLIN.h) && state.bet<state.coins) { state.bet=state.coins; sfxClick(); }
    else { for (const b of BW_PCT) { if (inRect(mouseX,mouseY,b.x,b.y,b.w,b.h)) { state.bet=Math.min(state.coins,Math.max(10,Math.round(state.coins*b.pct))); sfxClick(); break; } } }
    if (inRect(mouseX,mouseY,deal.x,deal.y,deal.w,deal.h) && state.coins>=10) { state.coins-=state.bet; doDeal(); sfxDeal(); }
  } else if (state.phase==='hold') {
    for (let i=0;i<5;i++) {
      const cy=PLAYER_Y-(state.heldCards[i]?HOLD_LIFT:0);
      if (inRect(mouseX,mouseY,CARD_COLS[i],cy,CARD_W,CARD_H)) {
        state.heldCards[i]=!state.heldCards[i];
        sfxHold(); return;
      }
    }
    if (inRect(mouseX,mouseY,HOLD_BTN.x,HOLD_BTN.y,HOLD_BTN.w,HOLD_BTN.h)) {
      doPlayerDraw();
      state.phase='playerDraw';
    }
  } else if (state.phase==='result') {
    const {deal}=BTN;
    if (inRect(mouseX,mouseY,BW_ALLIN.x,BW_ALLIN.y,BW_ALLIN.w,BW_ALLIN.h) && state.bet<state.coins) { state.bet=state.coins; sfxClick(); }
    else { for (const b of BW_PCT) { if (inRect(mouseX,mouseY,b.x,b.y,b.w,b.h)) { state.bet=Math.min(state.coins,Math.max(10,Math.round(state.coins*b.pct))); sfxClick(); break; } } }
    if (inRect(mouseX,mouseY,deal.x,deal.y,deal.w,deal.h) && state.coins>=10) {
      // Quick clear — wipe all card state instantly so the board blanks before the new cards fly in
      state.dealerCards=[]; state.playerCards=[];
      state.dealerRevealed=false;
      state.playerHandRank=null; state.dealerHandRank=null;
      state.playerScoring=[]; state.dealerScoring=[];
      state.heldCards=[false,false,false,false,false];
      state.dealerHeld=[false,false,false,false,false];
      state.playerNewCards=[false,false,false,false,false];
      state.flyCards=[]; particles=[];
      state.brokeAfterResult=false;
      state.revealFrame=0;
      state.bet=Math.min(state.bet, state.coins);
      if (state.bet<10) state.bet=10;
      state.coins-=state.bet;
      doDeal(); sfxDeal();
    }
  } else if (state.phase === 'gameOver') {
    const gb = GAMEOVER_BTN;
    if (inRect(mouseX, mouseY, gb.x, gb.y, gb.w, gb.h)) {
      doHardReset();
      sfxClick();
    }
  }
}
function updateCursor() {
  const betPtrCheck = () => {
    const {deal}=BTN;
    return (state.bet<state.coins && inRect(mouseX,mouseY,BW_ALLIN.x,BW_ALLIN.y,BW_ALLIN.w,BW_ALLIN.h))
      || BW_PCT.some(b=>inRect(mouseX,mouseY,b.x,b.y,b.w,b.h))
      || (state.coins>=10 && inRect(mouseX,mouseY,deal.x,deal.y,deal.w,deal.h));
  };
  let ptr=false;
  if (state.phase==='bet') {
    ptr = betPtrCheck();
  } else if (state.phase==='hold') {
    for (let i=0;i<5;i++) {
      const cy=PLAYER_Y-(state.heldCards[i]?HOLD_LIFT:0);
      if (inRect(mouseX,mouseY,CARD_COLS[i],cy,CARD_W,CARD_H)) { ptr=true; break; }
    }
    ptr=ptr||inRect(mouseX,mouseY,HOLD_BTN.x,HOLD_BTN.y,HOLD_BTN.w,HOLD_BTN.h);
  } else if (state.phase==='result') {
    ptr = betPtrCheck();
  } else if (state.phase === 'gameOver') {
    const gb = GAMEOVER_BTN;
    ptr = inRect(mouseX, mouseY, gb.x, gb.y, gb.w, gb.h);
  }
  canvas.style.cursor = ptr ? 'pointer' : 'default';
}

// ── Drawing Helpers ────────────────────────────────────────────────────────
function rRect(x,y,w,h,r) {
  ctx.beginPath();
  if (ctx.roundRect) { ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function drawSmallBtn(label, x, y, enabled, hovered, w=28) {
  rRect(x, y, w, 28, 4);
  ctx.fillStyle = !enabled ? '#0e0e10' : hovered ? '#7a3a1a' : '#3a1c10';
  ctx.fill();
  ctx.strokeStyle = !enabled ? '#1e1e22' : hovered ? '#d4a83c' : '#7a4a1a';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = `bold 14px ${F_GOTHIC}`;
  ctx.fillStyle = !enabled ? '#28282c' : '#e8d8a8';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + 14);
}

function drawDealBtn(label,x,y,w,h,enabled,hovered) {
  const cut=5;
  ctx.beginPath();
  ctx.moveTo(x+cut,y); ctx.lineTo(x+w-cut,y);
  ctx.lineTo(x+w,y+cut); ctx.lineTo(x+w,y+h-cut);
  ctx.lineTo(x+w-cut,y+h); ctx.lineTo(x+cut,y+h);
  ctx.lineTo(x,y+h-cut); ctx.lineTo(x,y+cut);
  ctx.closePath();
  ctx.fillStyle = !enabled ? '#0a0a10' : hovered ? '#7a4a1a' : '#3e2810';
  ctx.fill();
  ctx.strokeStyle = !enabled ? '#1e1e22' : hovered ? '#e8c870' : '#a8761a';
  ctx.lineWidth = 1.5; ctx.stroke();
  ctx.font = `22px ${F_BLACKLETTER}`;
  ctx.fillStyle = !enabled ? '#2a2a2e' : '#f0e0a8';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2);
}

// ── GRAVEYARD scene (offscreen, low-res, scaled up) ────────────────────────
const GY_LW = Math.ceil(W / PX);              // logical width
const GY_LH = Math.ceil(TABLE_TOP_Y / PX);    // logical height (~45)
let graveyard = null;
function rebuildGraveyard() {
  const off = document.createElement('canvas');
  off.width = GY_LW; off.height = GY_LH;
  const o = off.getContext('2d');

  // Sky gradient
  const sky = o.createLinearGradient(0, 0, 0, GY_LH);
  sky.addColorStop(0, '#0a0612');
  sky.addColorStop(0.6, '#13101e');
  sky.addColorStop(1, '#1e1c2a');
  o.fillStyle = sky;
  o.fillRect(0, 0, GY_LW, GY_LH);

  // Stars (deterministic)
  for (let i=0;i<55;i++) {
    const sx = (i * 7919) % GY_LW;
    const sy = (i * 1117) % Math.floor(GY_LH * 0.65);
    const bright = (i % 5 === 0);
    o.fillStyle = bright ? '#d4c890' : '#5a5868';
    o.fillRect(sx, sy, 1, 1);
  }

  // Moon (pixel art, with subtle craters)
  const mx = GY_LW - 30, my = 9;
  o.fillStyle = '#e0d8a8';
  o.fillRect(mx-2, my-1, 5, 3);
  o.fillRect(mx-1, my-2, 3, 1);
  o.fillRect(mx-1, my+2, 3, 1);
  o.fillStyle = '#a8a070';
  o.fillRect(mx-1, my, 1, 1);
  o.fillRect(mx+1, my+1, 1, 1);
  // Moon glow halo
  o.fillStyle = 'rgba(224,216,168,0.15)';
  o.fillRect(mx-4, my-1, 1, 2);
  o.fillRect(mx+4, my-1, 1, 2);
  o.fillRect(mx-1, my-4, 3, 1);
  o.fillRect(mx-1, my+4, 3, 1);

  // Distant misty hills (one undulating silhouette)
  o.fillStyle = '#101828';
  for (let x=0; x<GY_LW; x++) {
    const yy = GY_LH - 12 + Math.floor(Math.sin(x * 0.18) * 2 + Math.sin(x * 0.07) * 2);
    o.fillRect(x, yy, 1, GY_LH - yy);
  }

  // Tombstones — varying heights, scattered along the horizon
  const tombs = [
    { x: 8,   h: 9,  w: 4 },
    { x: 14,  h: 12, w: 5 },
    { x: 28,  h: 7,  w: 3, broken: true },
    { x: 36,  h: 11, w: 5 },
    { x: 60,  h: 8,  w: 4 },
    { x: 75,  h: 13, w: 5 },
    { x: 95,  h: 9,  w: 4 },
    { x: 122, h: 12, w: 6 },
    { x: 140, h: 8,  w: 4 },
    { x: 158, h: 11, w: 5 },
    { x: 178, h: 7,  w: 3 },
    { x: 192, h: 13, w: 5 },
    { x: 215, h: 9,  w: 4 },
    { x: 232, h: 11, w: 5 },
    { x: 250, h: 8,  w: 4, broken: true },
  ];
  o.fillStyle = '#0c0c14';
  for (const t of tombs) {
    if (t.x + t.w >= GY_LW) continue;
    o.fillRect(t.x, GY_LH - t.h, t.w, t.h);
    // Pixelated rounded top (1 pixel narrower)
    o.fillRect(t.x + 1, GY_LH - t.h - 1, t.w - 2, 1);
    // Broken/leaning tombstones look slightly tilted
    if (t.broken) {
      o.clearRect(t.x + t.w - 1, GY_LH - t.h, 1, 2);
      o.fillRect(t.x - 1, GY_LH - t.h + 1, 1, 1);
    }
  }
  // Carve crosses on a few of them
  o.fillStyle = '#1c1c26';
  const crossList = [14, 75, 122, 158, 215];
  for (const cx of crossList) {
    const t = tombs.find(t => t.x === cx);
    if (!t) continue;
    const ccx = t.x + Math.floor(t.w/2);
    const ccy = GY_LH - t.h + Math.floor(t.h/2);
    o.fillRect(ccx, ccy - 2, 1, 5);
    o.fillRect(ccx - 1, ccy - 1, 3, 1);
  }

  // Two prominent dead trees (left and right edges of the scene)
  // Left tree
  function deadTree(baseX, gnarled) {
    o.fillStyle = '#06060c';
    // Trunk
    o.fillRect(baseX + 2, GY_LH - 22, 2, 22);
    // Branches up-left
    o.fillRect(baseX, GY_LH - 22, 2, 1);
    o.fillRect(baseX - 1, GY_LH - 23, 2, 1);
    o.fillRect(baseX - 2, GY_LH - 24, 1, 2);
    // Branches up-right
    o.fillRect(baseX + 4, GY_LH - 24, 2, 1);
    o.fillRect(baseX + 6, GY_LH - 25, 1, 2);
    o.fillRect(baseX + 5, GY_LH - 27, 1, 2);
    // High branches
    o.fillRect(baseX + 1, GY_LH - 26, 1, 4);
    o.fillRect(baseX + 3, GY_LH - 28, 1, 5);
    if (gnarled) {
      o.fillRect(baseX + 2, GY_LH - 30, 1, 2);
      o.fillRect(baseX + 4, GY_LH - 30, 1, 2);
      o.fillRect(baseX + 0, GY_LH - 28, 1, 1);
    }
    // Small twigs
    o.fillRect(baseX - 3, GY_LH - 26, 2, 1);
    o.fillRect(baseX + 6, GY_LH - 28, 2, 1);
  }
  deadTree(4, true);
  deadTree(GY_LW - 12, true);

  // A small church/crypt silhouette on the horizon
  const cryptX = Math.floor(GY_LW * 0.35);
  o.fillStyle = '#08080e';
  o.fillRect(cryptX, GY_LH - 16, 12, 16);
  // Roof
  o.fillRect(cryptX + 1, GY_LH - 18, 10, 2);
  o.fillRect(cryptX + 3, GY_LH - 20, 6, 2);
  // Spire
  o.fillRect(cryptX + 5, GY_LH - 24, 2, 4);
  // Small cross atop
  o.fillStyle = '#3a3a4a';
  o.fillRect(cryptX + 5, GY_LH - 27, 2, 1);
  o.fillRect(cryptX + 5, GY_LH - 28, 2, 1);
  o.fillRect(cryptX + 4, GY_LH - 27, 1, 1);
  o.fillRect(cryptX + 7, GY_LH - 27, 1, 1);
  // Door
  o.fillStyle = '#16161e';
  o.fillRect(cryptX + 5, GY_LH - 8, 2, 4);

  // Mist layer near the bottom
  for (let mx = 0; mx < GY_LW; mx++) {
    for (let my = GY_LH - 6; my < GY_LH; my++) {
      const a = ((my - (GY_LH - 6)) / 6) * 0.32;
      const noise = ((mx * 53) ^ (my * 31)) % 7;
      if (noise < 4) {
        o.fillStyle = `rgba(150,150,165,${a})`;
        o.fillRect(mx, my, 1, 1);
      }
    }
  }

  graveyard = off;
}
rebuildGraveyard();

// ── FELT (table felt area only) ────────────────────────────────────────────
let felt = null;
function rebuildFelt() {
  const fw = MAIN_W;            // 652
  const fh = H - TABLE_FELT_Y;  // 458
  const off = document.createElement('canvas');
  off.width = fw; off.height = fh;
  const o = off.getContext('2d');

  o.fillStyle = '#0e1f15';
  o.fillRect(0,0,fw,fh);

  // Pixelated dither
  for (let y=0; y<fh; y+=4) {
    for (let x=0; x<fw; x+=4) {
      const seed = (x*73856093) ^ (y*19349663);
      const n = (seed >>> 0) % 256;
      if (n < 32)      o.fillStyle = '#16301f';
      else if (n < 60) o.fillStyle = '#0a1a10';
      else if (n < 75) o.fillStyle = '#15281a';
      else continue;
      o.fillRect(x,y,4,4);
    }
  }

  const grad = o.createRadialGradient(fw/2, fh/2, 100, fw/2, fh/2, 420);
  grad.addColorStop(0,'rgba(0,0,0,0)');
  grad.addColorStop(1,'rgba(0,0,0,0.55)');
  o.fillStyle = grad; o.fillRect(0,0,fw,fh);

  // Faint N logo center of felt — heavy blackletter
  o.font = `320px ${F_BLACKLETTER}`;
  o.fillStyle = 'rgba(70,130,90,0.12)';
  o.textAlign = 'center'; o.textBaseline = 'middle';
  o.fillText('N', fw/2, fh/2);

  felt = off;
}

  dctx.beginPath(); dctx.moveTo(79, 28); dctx.lineTo(75, 32); dctx.stroke();

  // ── Tattered hem (irregular notches and dangling bits) ──
  dctx.fillStyle = '#040408';
  for (let x=2; x<DEALER_LW-2; x++) {
    if ((x*7) % 11 < 4) dctx.fillRect(x, baseY, 1, 1);
    if ((x*5) % 13 < 3) dctx.fillRect(x, baseY-1, 1, 1);
  }
  // Larger torn notches
  dctx.fillStyle = '#0e0e16';
  dctx.fillRect(8, baseY-1, 3, 1);
  dctx.fillRect(80, baseY-1, 3, 1);
  dctx.fillRect(33, baseY, 2, 1);
  dctx.fillRect(58, baseY, 2, 1);
  // Hanging strand fragments
  dctx.fillStyle = '#08080e';
  dctx.fillRect(15, baseY, 1, 2);
  dctx.fillRect(72, baseY, 1, 2);

  // ── HOOD: deep fabric cowl casting the face in shadow ──
  // Hood cloth layer — extends past the face void so the fabric visibly frames the opening
  dctx.fillStyle = '#0d0d19';
  dctx.beginPath();
  dctx.moveTo(cx, 0);          // pointed peak
  dctx.lineTo(cx + 4, 2);
  dctx.lineTo(cx + 9, 6);
  dctx.lineTo(cx + 14, 12);
  dctx.lineTo(cx + 13, 27);   // brim — lower right, past face void center
  dctx.lineTo(cx - 13, 27);   // brim — across bottom
  dctx.lineTo(cx - 14, 12);
  dctx.lineTo(cx - 9, 6);
  dctx.lineTo(cx - 4, 2);
  dctx.closePath();
  dctx.fill();
  // Hood outer edge catch-light
  dctx.strokeStyle = '#1e1e2e'; dctx.lineWidth = 1; dctx.stroke();

  // Fabric folds — lines radiating from the peak like cloth gathered to a point
  dctx.strokeStyle = '#17172a'; dctx.lineWidth = 1;
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx - 6, 14);  dctx.stroke();
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx - 11, 20); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx - 13, 27); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx + 6, 14);  dctx.stroke();
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx + 11, 20); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(cx, 1); dctx.lineTo(cx + 13, 27); dctx.stroke();

  // Hood brim lip — inner curved crease where the fabric folds inward over the face opening
  dctx.strokeStyle = '#2a2a3e'; dctx.lineWidth = 1;
  dctx.beginPath();
  dctx.moveTo(cx - 11, 27);
  dctx.quadraticCurveTo(cx, 21, cx + 11, 27);
  dctx.stroke();

  // Face void — absolute black deep inside the hood, face fully in shadow
  dctx.fillStyle = '#000';
  dctx.beginPath();
  dctx.ellipse(cx, 21, 8, 12, 0, 0, Math.PI * 2);
  dctx.fill();
  // Inner rim of the hood opening (faint edge, suggests fabric depth)
  dctx.strokeStyle = '#18182a'; dctx.lineWidth = 1;
  dctx.beginPath();
  dctx.ellipse(cx, 21, 8, 12, 0, 0, Math.PI * 2);
  dctx.stroke();

  // ── Glowing eyes (flickering; turn glowy red during dealer reveal, then back to gold) ──
  const isRevealing = state.dealerAnim === 'revealing';
  const revF = state.dealerAnimFrame;
  let eyeR = 240, eyeG = 200, eyeB = 90;
  let flickSpeed = 0.13;
  if (isRevealing) {
    flickSpeed = 0.38; // faster flicker during the reveal
    if (revF < 12) {
      const t = revF / 12;
      eyeR = Math.round(240 + (200 - 240) * t);
      eyeG = Math.round(200 + (20  - 200) * t);
      eyeB = Math.round(90  + (20  -  90) * t);
    } else if (revF < 72) {
      eyeR = 200; eyeG = 20; eyeB = 20;
    } else {
      const t = (revF - 72) / 12;
      eyeR = Math.round(200 + (240 - 200) * t);
      eyeG = Math.round(20  + (200 -  20) * t);
      eyeB = Math.round(20  + (90  -  20) * t);
    }
  }
  const flick = 0.5 + 0.5 * Math.sin(f * flickSpeed);
  // Eyes set deep in the void, just below the brim shadow
  dctx.fillStyle = `rgba(${eyeR},${eyeG},${eyeB},${0.68 + flick*0.32})`;
  dctx.fillRect(cx - 4, 18, 2, 2);
  dctx.fillRect(cx + 2, 18, 2, 2);
  // Eye glow leak — bleeds softly into the surrounding darkness
  dctx.fillStyle = `rgba(${eyeR},${eyeG},${eyeB},${0.16 + flick*0.10})`;
  dctx.fillRect(cx - 5, 18, 1, 2);
  dctx.fillRect(cx + 4, 18, 1, 2);
  dctx.fillRect(cx - 4, 17, 2, 1);
  dctx.fillRect(cx + 2, 17, 2, 1);

  // ── Cowl / shoulder cape — a layered fabric drape over the shoulders ──
  dctx.fillStyle = '#0c0c14';
  dctx.beginPath();
  dctx.moveTo(20, 26);
  dctx.lineTo(28, 30);
  dctx.lineTo(45, 32);
  dctx.lineTo(62, 30);
  dctx.lineTo(70, 26);
  dctx.lineTo(72, 30);
  dctx.lineTo(60, 33);
  dctx.lineTo(45, 35);
  dctx.lineTo(30, 33);
  dctx.lineTo(18, 30);
  dctx.closePath();
  dctx.fill();
  dctx.strokeStyle = '#1a1a26';
  dctx.lineWidth = 1; dctx.stroke();

  // ── Pendant medallion (hangs from chain over the cowl) ──
  // Chain
  dctx.fillStyle = '#5a4218';
  dctx.fillRect(cx - 1, 30, 1, 2);
  dctx.fillRect(cx + 1, 31, 1, 2);
  // Medallion
  dctx.fillStyle = '#a8761a';
  dctx.fillRect(cx - 2, 33, 4, 3);
  dctx.fillStyle = '#e0c870';
  dctx.fillRect(cx - 1, 33, 1, 1);
  dctx.fillStyle = '#5a3418';
  dctx.fillRect(cx, 34, 1, 1);

  // ── Hands (palm-down at rest; both flip palm-up briefly during reveal) ──
  let leftX = 14, rightX = 76;
  let leftY = 43, rightY = 43;  // positioned so fingertips reach into the felt area
  let leftRot = 0.0, rightRot = 0.0;
  let palmUp = false;
  let scaleX = 1;

  if (state.dealerAnim === 'revealing') {
    // 0–12: flip palm-down → palm-up
    // 12–72: hold palm-up (~1 sec)
    // 72–84: flip palm-up → palm-down
    const f = state.dealerAnimFrame;
    if (f < 12) {
      const t = f / 12;
      scaleX = Math.abs(Math.cos(t * Math.PI));
      palmUp = t > 0.5;
    } else if (f < 72) {
      palmUp = true;
    } else {
      const t = (f - 72) / 12;
      scaleX = Math.abs(Math.cos(t * Math.PI));
      palmUp = t < 0.5;
    }
  }

  dctx.restore();
  // Hands are NOT drawn here — they are drawn directly on the main canvas
  // after the felt so they sit on top of the board (see drawDealerHandsOnFelt).

  // Composite to main canvas — bob applied here so the pre-rendered sprite shifts
  // as a whole (smooth, uniform image translation, no per-pixel smear).
  // Clipped to TABLE_TOP_Y so the dealer body stays behind the board.
  const bob = Math.sin(f * 0.008) * 3;  // very slow ±3px float (~13s cycle)
  const drawY = Math.round(2 + bob);
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, W, TABLE_TOP_Y);
  ctx.clip();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(dealerCanvas, MAIN_CX - DEALER_DRAW_W/2, drawY, DEALER_DRAW_W, DEALER_DRAW_H);
  ctx.imageSmoothingEnabled = true;
  ctx.restore();
}

// Palm-down hand with spread fingers — works on any context at any pixel scale (sc).
// Coordinates are "logical pixels"; pass sc=1 for the offscreen dealer canvas,
// sc=N to scale up onto the main canvas.
function drawDealerHand(tctx, sc, cx, cy, mirror, rot) {
  tctx.save();
  tctx.translate(cx, cy);
  if (mirror) tctx.scale(-1, 1);
  tctx.rotate(rot);

  // Pixel-rect helper (rounded so the upscaled image stays crisp)
  const r = (x, y, w, h, color) => {
    tctx.fillStyle = color;
    tctx.fillRect(Math.round(x*sc), Math.round(y*sc), w*sc, h*sc);
  };

  // ── Sleeve cuff — narrow at the top where it meets the sleeve, then widens slightly ──
  const robe = '#0a0a10';
  r(-5, -10, 10, 1, robe);  // 10 px — top of cuff (narrow join to sleeve)
  r(-4,  -9,  9, 1, robe);  //  9
  r(-4,  -8,  8, 1, robe);  //  8
  r(-3,  -7,  7, 1, robe);  //  7
  r(-3,  -6,  6, 1, robe);  //  6
  r(-2,  -5,  5, 1, robe);  //  5 — wrist narrowest point
  // Cuff hem highlight (one shade lighter than robe)
  r(-2,  -4,  5, 1, '#1a1a26');

  // ── Back of hand — widens slightly from the wrist, giving a natural curve ──
  const skin      = '#88735c';
  const skinDark  = '#5e4d3a';
  const skinLight = '#a8927a';
  r(-5, -3, 11, 4, skin);   // 11 px — noticeably wider than the 7-px wrist
  // Tendon shadows running toward the fingers
  r(-3, -2, 1, 3, skinDark);
  r( 0, -2, 1, 3, skinDark);
  r( 3, -2, 1, 3, skinDark);
  // Knuckle ridge — 2px wide, aligned with each finger base
  r(-5, 0, 2, 1, '#5a4830');
  r(-2, 0, 2, 1, '#5a4830');
  r( 1, 0, 2, 1, '#5a4830');
  r( 4, 0, 2, 1, '#5a4830');

  // ── Spread fingers — 2px wide, tapered tip, knuckle indent, highlight ──
  function finger(baseX, tipX, len, hasWart) {
    const span     = Math.max(len - 1, 1);
    const knuckleY = Math.floor(len * 0.45); // knuckle crease ~halfway down
    for (let dy = 0; dy < len; dy++) {
      const t  = dy / span;
      const fx = Math.round(baseX + (tipX - baseX) * t);
      const fw = (dy >= len - 1) ? 1 : 2;   // taper to 1px at the very tip
      // Base colour: knuckle crease is darker, otherwise normal skin
      const col = (dy === knuckleY) ? skinDark : skin;
      r(fx, 1 + dy, fw, 1, col);
      // Top-edge highlight on the fleshy top of the finger
      if (fw === 2 && dy > 0 && dy < knuckleY) {
        r(fx, 1 + dy, 1, 1, skinLight);
      }
    }
    if (hasWart) {
      const wartX = Math.round(baseX + (tipX - baseX) * 0.6);
      const wartY = 1 + Math.floor(len * 0.6);
      r(wartX, wartY, 1, 1, '#3a2820');
    }
    // Nail: two-tone at the very tip
    r(tipX, 1 + len,     1, 1, '#8a6a30');
    r(tipX, 1 + len + 1, 1, 1, '#5a4a28');
  }

  finger(-5, -8, 5, true);   // pinky  — short,  fans hard left
  finger(-2, -4, 7, false);  // ring   — medium, fans left
  finger( 1,  1, 8, false);  // middle — longest, near-straight
  finger( 4,  6, 7, true);   // index  — medium, fans right

  // ── Thumb (visible at the inner side, palm-down) ──
  r(7, -2, 2, 2, skin);
  r(8, -1, 2, 1, skin);
  r(9,  0, 2, 1, skin);
  r(10, 1, 1, 1, '#8a6a30'); // thumbnail
  r( 9, 2, 1, 1, '#5a4a28');

  tctx.restore();
}

// Draw the dealer's two hands directly on the main canvas, above the felt.
// Called after the felt is drawn so the hands sit on top of the board.
// Positions are fixed (no bob) so the hands never move.
function drawDealerHandsOnFelt() {
  // Mirror hand X positions from the offscreen dealer canvas:
  // offscreen origin = MAIN_CX - DEALER_DRAW_W/2 = 339; logical leftX=14, rightX=76
  const BASE_X  = MAIN_CX - DEALER_DRAW_W / 2;
  const leftCX  = BASE_X + 14 * PX;  // 381
  const rightCX = BASE_X + 76 * PX;  // 567
  // Moved up 10 px from the previous TABLE_FELT_Y + 6 position
  const handCY   = TABLE_FELT_Y - 4;              // 138
  const cuffTopY  = handCY - 10 * PX;  // 108 — top of the cuff/wrist section
  const cuffHalfW = 5 * PX;            // 15 — matches narrowed cuff top (10px logical)

  // ── Bell sleeves — gothic pointed-arch shape, merging seamlessly into the robe body ──
  // The sleeve converges to a single point at sleeveTopY (inside the robe silhouette),
  // flares to bellHalfW in the middle, then tapers back to match the cuff width.
  const sleeveTopY = 70;  // inside robe body — hides the join, no visible seam
  const bellHalfW  = 16;  // stays within the robe bell outline at all heights

  const robeBody = '#09090f';
  const robeEdge = '#1c1c28';
  const robeFold = '#131320';

  for (const hx of [leftCX, rightCX]) {
    // Pointed gothic arch: left bezier up to tip, right bezier back down
    ctx.beginPath();
    ctx.moveTo(hx - cuffHalfW, cuffTopY);
    ctx.bezierCurveTo(
      hx - cuffHalfW - 4, cuffTopY - 14,  // ease out of cuff
      hx - bellHalfW,     92,              // flare to bell width
      hx,                 sleeveTopY       // converge to a point inside the robe
    );
    ctx.bezierCurveTo(
      hx + bellHalfW,     92,              // mirror flare on right side
      hx + cuffHalfW + 4, cuffTopY - 14,  // ease back to cuff
      hx + cuffHalfW,     cuffTopY
    );
    // Concave wrist hemline — scoops inward at center, giving the illusion
    // that the fabric stretches around the hands as they emerge from the sleeve
    ctx.quadraticCurveTo(hx, cuffTopY - 10, hx - cuffHalfW, cuffTopY);
    ctx.fillStyle = robeBody; ctx.fill();
    ctx.strokeStyle = robeEdge; ctx.lineWidth = 1.5; ctx.stroke();
    // Centre crease — weight of the fabric hanging down
    ctx.strokeStyle = robeFold; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hx, sleeveTopY + 10);
    ctx.lineTo(hx, cuffTopY - 2);
    ctx.stroke();
  }

  // Hands on top (cuff naturally overlaps the sleeve hem)
  drawDealerHand(ctx, PX, leftCX,  handCY, false, 0);
  drawDealerHand(ctx, PX, rightCX, handCY, true,  0);
}

// ── Crows ──────────────────────────────────────────────────────────────────
function drawCrow(c) {
  if (c.y > TABLE_TOP_Y - 6) return;

  const x = Math.floor(c.x / PX) * PX;
  const y = Math.floor(c.y / PX) * PX;
  const wingsUp = Math.sin(c.flap) > 0;

  ctx.fillStyle = '#08060a';

  if (wingsUp) {
    // High-V silhouette
    ctx.fillRect(x - 2*PX, y, PX, PX);
    ctx.fillRect(x - PX,   y + PX, PX, PX);
    ctx.fillRect(x,        y + 2*PX, PX, PX);
    ctx.fillRect(x + PX,   y + PX, PX, PX);
    ctx.fillRect(x + 2*PX, y, PX, PX);
    // Body extension
    ctx.fillRect(x,        y + PX, PX, PX);
  } else {
    // Flat-V silhouette (lower)
    ctx.fillRect(x - 2*PX, y + PX, PX, PX);
    ctx.fillRect(x - PX,   y + 2*PX, PX, PX);
    ctx.fillRect(x,        y + 2*PX, PX, PX);
    ctx.fillRect(x + PX,   y + 2*PX, PX, PX);
    ctx.fillRect(x + 2*PX, y + PX, PX, PX);
    ctx.fillRect(x,        y + PX, PX, PX);
  }
}

// ── Table edge (wooden plank running across, full width) ───────────────────
function drawTableEdge() {
  // Outer gold-brown band
  ctx.fillStyle = '#3a2412';
  ctx.fillRect(0, TABLE_TOP_Y, W, TABLE_EDGE_H);
  // Top sheen line
  ctx.fillStyle = '#7a4e22';
  ctx.fillRect(0, TABLE_TOP_Y, W, 2);
  ctx.fillStyle = '#a8761a';
  ctx.fillRect(0, TABLE_TOP_Y, W, 1);
  // Wood grain striations
  ctx.fillStyle = '#241608';
  for (let x = 0; x < W; x += 9) {
    ctx.fillRect(x, TABLE_TOP_Y + 4, 1, 1);
    ctx.fillRect(x + 4, TABLE_TOP_Y + 6, 1, 1);
  }
  for (let x = 6; x < W; x += 13) {
    ctx.fillRect(x, TABLE_TOP_Y + 3, 2, 1);
  }
  // Bottom shadow
  ctx.fillStyle = '#16100c';
  ctx.fillRect(0, TABLE_TOP_Y + TABLE_EDGE_H - 1, W, 1);
}

// ── Card icon drawings ─────────────────────────────────────────────────────
// Each icon function draws into a target context `t` so the icon can be cached
// to an offscreen canvas, then upscaled with imageSmoothingEnabled=false for
// the chunky pixel-art look that matches the dealer & background.
function drawIconRat(t, cx, cy, color, dark) {
  t.fillStyle = color; t.strokeStyle = '#1a1a1a'; t.lineWidth = 1.5;

  // Body (hunched oval, slightly tilted)
  t.beginPath();
  t.ellipse(cx - 1, cy + 3, 13, 8, -0.15, 0, Math.PI * 2);
  t.fill(); t.stroke();

  // Head (smaller, forward and slightly up)
  t.beginPath();
  t.ellipse(cx + 11, cy - 2, 6, 5, 0.2, 0, Math.PI * 2);
  t.fill(); t.stroke();

  // Snout (small forward bump)
  t.beginPath();
  t.ellipse(cx + 16, cy, 3, 2.5, 0.1, 0, Math.PI * 2);
  t.fill(); t.stroke();

  // Ear (small circle on top of head)
  t.fillStyle = dark;
  t.beginPath();
  t.arc(cx + 9, cy - 7, 3, 0, Math.PI * 2);
  t.fill(); t.stroke();
  t.fillStyle = '#6a2a30';
  t.beginPath();
  t.arc(cx + 9, cy - 7, 1.5, 0, Math.PI * 2);
  t.fill();

  // Eye
  t.fillStyle = '#080808';
  t.beginPath();
  t.arc(cx + 13, cy - 3, 1.3, 0, Math.PI * 2);
  t.fill();
  // Shine
  t.fillStyle = 'rgba(255,255,255,0.55)';
  t.beginPath();
  t.arc(cx + 13.5, cy - 3.5, 0.5, 0, Math.PI * 2);
  t.fill();

  // Whiskers
  t.strokeStyle = '#333'; t.lineWidth = 0.7;
  t.beginPath(); t.moveTo(cx + 16, cy - 1); t.lineTo(cx + 21, cy - 3); t.stroke();
  t.beginPath(); t.moveTo(cx + 16, cy + 1); t.lineTo(cx + 21, cy + 2); t.stroke();
  t.beginPath(); t.moveTo(cx + 16, cy);     t.lineTo(cx + 21, cy); t.stroke();

  // Fur texture (short strokes on body)
  t.strokeStyle = dark; t.lineWidth = 0.8;
  t.beginPath(); t.moveTo(cx - 4, cy - 2); t.lineTo(cx - 2, cy - 5); t.stroke();
  t.beginPath(); t.moveTo(cx + 2, cy - 3); t.lineTo(cx + 4, cy - 6); t.stroke();
  t.beginPath(); t.moveTo(cx - 9, cy + 1); t.lineTo(cx - 7, cy - 2); t.stroke();

  // Tail (long thin curve from back of body)
  t.strokeStyle = '#3a3a3a'; t.lineWidth = 1.5; t.lineCap = 'round';
  t.beginPath();
  t.moveTo(cx - 13, cy + 3);
  t.bezierCurveTo(cx - 20, cy + 6, cx - 22, cy - 4, cx - 17, cy - 10);
  t.stroke();
  t.lineCap = 'butt';

  // Legs (small stubs under body)
  t.fillStyle = dark; t.strokeStyle = '#1a1a1a'; t.lineWidth = 1;
  t.fillRect(cx - 7, cy + 9, 4, 6);
  t.strokeRect(cx - 7, cy + 9, 4, 6);
  t.fillRect(cx + 1, cy + 9, 4, 6);
  t.strokeRect(cx + 1, cy + 9, 4, 6);
}
function drawIconHelmet(t, cx, cy, color, dark) {
  // Plume (red, behind the helmet — drawn first)
  t.strokeStyle = '#cc1122'; t.lineWidth = 3;
  t.lineCap = 'round';
  t.beginPath();
  t.moveTo(cx + 2, cy - 12);
  t.bezierCurveTo(cx + 10, cy - 20, cx + 20, cy - 16, cx + 17, cy - 6);
  t.stroke();
  t.strokeStyle = '#ee3333'; t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(cx + 4, cy - 11);
  t.bezierCurveTo(cx + 12, cy - 19, cx + 18, cy - 13, cx + 15, cy - 5);
  t.stroke();
  t.lineCap = 'butt';

  // Helmet dome
  t.fillStyle = color; t.strokeStyle = '#000'; t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(cx - 13, cy + 2);
  t.lineTo(cx - 13, cy + 12);
  t.lineTo(cx + 10, cy + 12);
  t.lineTo(cx + 10, cy + 2);
  t.arc(cx - 1.5, cy + 2, 11.5, 0, Math.PI, true);
  t.closePath();
  t.fill(); t.stroke();

  // Cheek guards (darker)
  t.fillStyle = dark;
  t.fillRect(cx - 13, cy + 2, 3, 10);
  t.fillRect(cx + 7, cy + 2, 3, 10);

  // Visor slit
  t.fillStyle = '#050508';
  t.fillRect(cx - 10, cy + 3, 20, 4);

  // Grill bars below visor
  t.strokeStyle = dark; t.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    t.beginPath();
    t.moveTo(cx - 9 + i * 6, cy + 8);
    t.lineTo(cx - 9 + i * 6, cy + 12);
    t.stroke();
  }

  // Brim strip
  t.fillStyle = dark;
  t.fillRect(cx - 14, cy + 12, 25, 3);

  // Highlight sheen on dome
  t.strokeStyle = 'rgba(255,255,255,0.22)'; t.lineWidth = 1.2;
  t.beginPath();
  t.moveTo(cx - 8, cy - 4);
  t.quadraticCurveTo(cx - 2, cy - 11, cx + 4, cy - 8);
  t.stroke();
}
function drawIconGoblet(t, cx, cy, color, dark) {
  t.fillStyle = color; t.strokeStyle = '#000'; t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(cx-13, cy-13); t.lineTo(cx+13, cy-13); t.lineTo(cx+11, cy-2);
  t.quadraticCurveTo(cx, cy+2, cx-11, cy-2);
  t.closePath(); t.fill(); t.stroke();
  t.fillStyle = '#5a1c26'; t.fillRect(cx-13, cy-13, 26, 2.5);
  t.fillStyle = color; t.fillRect(cx-2, cy-2, 4, 13); t.strokeRect(cx-2, cy-2, 4, 13);
  t.beginPath();
  t.moveTo(cx-11, cy+11); t.lineTo(cx+11, cy+11);
  t.lineTo(cx+9, cy+14);  t.lineTo(cx-9, cy+14);
  t.closePath(); t.fill(); t.stroke();
  t.fillStyle = '#c43050';
  t.beginPath(); t.arc(cx, cy-7, 2, 0, Math.PI*2); t.fill();
  t.strokeStyle = '#000'; t.lineWidth = 0.6; t.stroke();
  t.fillStyle = 'rgba(255,255,255,0.18)';
  t.fillRect(cx-10, cy-10, 2, 6);
}
function drawIconJewel(t, cx, cy, color, dark) {
  // Octagonal gem outline
  t.fillStyle = color; t.strokeStyle = '#000'; t.lineWidth = 1.5;
  t.beginPath();
  t.moveTo(cx,    cy-15);
  t.lineTo(cx+8,  cy-9);
  t.lineTo(cx+13, cy);
  t.lineTo(cx+8,  cy+9);

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  // Black backdrop (in case anything peeks through)
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, W, H);

  // ── (1) Graveyard scene (full width above horizon) ───────────────────────
  if (graveyard) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(graveyard, 0, 0, W, TABLE_TOP_Y);
    ctx.imageSmoothingEnabled = true;
  }

  // ── (2) Crows ────────────────────────────────────────────────────────────
  for (const c of crows) drawCrow(c);

  // ── (3) Ambient embers (above table only) ────────────────────────────────
  for (const p of ambient) {
    if (p.y > TABLE_TOP_Y - 2) continue;
    const flick = 0.7 + 0.3 * Math.sin(state.animFrame * 0.05 + p.flick);
    ctx.globalAlpha = p.alpha * flick;

  // ── (5) Wooden table edge (full width — covers the dealer's lower pixels) ─
  drawTableEdge();

  // ── (6) Felt below the edge ──────────────────────────────────────────────
  if (felt) ctx.drawImage(felt, PT_W, TABLE_FELT_Y);

  // ── (6b) Dealer hands — on top of the felt, fully static ─────────────────
  drawDealerHandsOnFelt();

  // ── (7) Pay table panel (only below the table edge) ─────────────────────
  ctx.fillStyle = '#0a0612';
  ctx.fillRect(0, TABLE_FELT_Y, PT_W, H - TABLE_FELT_Y);
  ctx.fillStyle = '#3a2818';
  ctx.fillRect(PT_W-1, TABLE_FELT_Y, 1, H - TABLE_FELT_Y);
  ctx.fillStyle = 'rgba(212, 168, 60, 0.35)';
  ctx.fillRect(PT_W-2, TABLE_FELT_Y, 1, H - TABLE_FELT_Y);

  // Pay table header — heavy blackletter
  ctx.font = `22px ${F_BLACKLETTER}`;
  ctx.fillStyle = '#f0c860';
  ctx.shadowColor = '#d4a83c'; ctx.shadowBlur = 8;
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Pay Table', PT_W/2, TABLE_FELT_Y + 26);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#8a6418'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(16, TABLE_FELT_Y + 34);
  ctx.lineTo(PT_W-16, TABLE_FELT_Y + 34);
  ctx.stroke();

  // Pay table rows — squished + higher contrast
  const PT_ROW_Y0 = TABLE_FELT_Y + 44;
  const PT_ROW_H  = 48;
  for (let i=0; i<HAND_RANKINGS.length; i++) {
    const r = HAND_RANKINGS[i], ry = PT_ROW_Y0 + i*PT_ROW_H;
    const isPlayer = state.playerHandRank && state.playerHandRank.index === i;
    const isDealer = state.dealerHandRank && state.dealerHandRank.index === i;

    if (isPlayer || isDealer) {
      ctx.fillStyle = isPlayer ? 'rgba(126, 182, 80, 0.22)' : 'rgba(196, 76, 90, 0.20)';
      ctx.fillRect(0, ry-2, PT_W, PT_ROW_H-2);
      ctx.fillStyle = isPlayer ? '#9eda60' : '#d05262';
      ctx.fillRect(PT_W-3, ry-2, 3, PT_ROW_H-2);
    }

    ctx.font = `bold 13px ${F_GOTHIC}`;
    ctx.fillStyle = isPlayer ? '#c8f070' : isDealer ? '#f06872' : '#a89e80';
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(r.name, 8, ry+18);

    ctx.font = `bold 19px ${F_GOTHIC}`;
    ctx.fillStyle = isPlayer ? '#d4f878' : isDealer ? '#f87080' : '#7a6b48';
    ctx.textAlign = 'right';
    ctx.fillText(r.mult > 0 ? r.mult+'×' : '✗', PT_W-7, ry+22);

    ctx.font = `9px ${F_GOTHIC}`;
    ctx.fillStyle = (isPlayer||isDealer) ? '#7a6c54' : '#5a4830';

  for (let i=0; i<5; i++) {
    const c = state.dealerCards[i];
    const scoring = isResult && state.dealerScoring.includes(i);
    const targetSlot = state.dealerOrder.indexOf(i);
    const origX = CARD_COLS[i];
    const targetX = CARD_COLS[targetSlot >= 0 ? targetSlot : i];
    const cardX = origX + (targetX - origX) * revealT;

    // Lift: scoring (result) or progressive raise (dealerHold/dealerDraw — held cards stay raised)

      const decideFrame = 30 + i * 25;
      const raiseDur = 12;
      const t = Math.max(0, Math.min(1, (state.dealerHoldFrame - decideFrame) / raiseDur));
      lift = HOLD_LIFT * easeInOut(t);
    } else if (isDealerDraw && state.dealerHeld[i]) {
      lift = HOLD_LIFT;
    }

        ctx.scale(revFlip.scaleX, 1);
        ctx.translate(-flipCX, 0);

    ctx.fillStyle = '#f06872';
    ctx.shadowColor = '#8a2030'; ctx.shadowBlur = 6;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(state.dealerHandRank.name, MAIN_CX, DEALER_Y - 20);

    ctx.beginPath();
    ctx.moveTo(hb.x+cut, hb.y); ctx.lineTo(hb.x+hb.w-cut, hb.y);
    ctx.lineTo(hb.x+hb.w, hb.y+cut); ctx.lineTo(hb.x+hb.w, hb.y+hb.h-cut);
    ctx.lineTo(hb.x+hb.w-cut, hb.y+hb.h); ctx.lineTo(hb.x+cut, hb.y+hb.h);
    ctx.lineTo(hb.x, hb.y+hb.h-cut); ctx.lineTo(hb.x, hb.y+cut);

    ctx.strokeStyle = hov ? '#f0d878' : '#a8761a'; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowColor = '#e8c870'; ctx.shadowBlur = hov ? 22 : 8;
    ctx.font = `32px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#f8e8b0';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Hold', hb.x + hb.w/2, hb.y + hb.h/2 + 2);
    ctx.shadowBlur = 0;

    ctx.font = `11px ${F_GOTHIC}`;
    ctx.fillStyle = '#5a5444';

  } else if (state.phase === 'result') {
    const winC = '#9eda60', pushC = '#e8c870', lossC = '#d05262';
    const c = state.resultIsWin ? winC : state.resultIsPush ? pushC : lossC;
    const word = state.resultIsWin ? 'Victory!' : state.resultIsPush ? 'A Tie' : 'Dealer Wins';

      ctx.fillStyle = c;
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'center';
      ctx.font = `40px ${F_BLACKLETTER}`;
      ctx.fillText('Victory!', MAIN_CX, ACTION_CY + 6);
      ctx.shadowBlur = 0;
      ctx.restore();
    } else {
      ctx.shadowColor = c; ctx.shadowBlur = 26;
      ctx.font = `40px ${F_BLACKLETTER}`;
      ctx.fillStyle = c; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillText(word, MAIN_CX, ACTION_CY + 6);
      ctx.shadowBlur = 0;
    }

    ctx.font = `13px ${F_GOTHIC}`;
    ctx.fillStyle = '#9a9286';
    ctx.fillText(state.resultMessage, MAIN_CX, ACTION_CY + 26);

  } else if (state.phase === 'dealerHold') {
    // Dealer is "deciding" — animated ellipsis cycles every ~0.5 sec
    const dotCount = 1 + Math.floor(state.dealerHoldFrame / 30) % 3;
    const dots = '.'.repeat(dotCount) + ' '.repeat(3 - dotCount);
    ctx.shadowColor = '#5a4218'; ctx.shadowBlur = 10;
    ctx.font = `26px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#c8a868';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(`The dealer ponders${dots}`, MAIN_CX, ACTION_CY + 4);
    ctx.shadowBlur = 0;

    ctx.font = `11px ${F_GOTHIC}`;
    ctx.fillStyle = '#5a5444';

    ctx.font = `26px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#c8a868';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('The dealer deals…', MAIN_CX, ACTION_CY + 4);
    ctx.shadowBlur = 0;
  } else if (state.phase === 'playerDraw') {
    ctx.shadowColor = '#5a4218'; ctx.shadowBlur = 10;
    ctx.font = `26px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#c8a868';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('New cards dealt…', MAIN_CX, ACTION_CY + 4);
    ctx.shadowBlur = 0;
  } else if (state.phase === 'dealerDraw') {
    ctx.shadowColor = '#5a4218'; ctx.shadowBlur = 10;
    ctx.font = `26px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#c8a868';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Dealer draws…', MAIN_CX, ACTION_CY + 4);

  // ── (11) Player cards ────────────────────────────────────────────────────
  for (let i=0; i<5; i++) {
    const c = state.playerCards[i];
    const heldNow = state.phase === 'hold' && state.heldCards[i];
    const scoring = isResult && state.playerScoring.includes(i);
    // Player's chosen holds stay raised through dealerHold/dealerDraw too
    const liftedDuringDraw =
      (state.phase === 'playerDraw' || state.phase === 'dealerHold' || state.phase === 'dealerDraw') && state.heldCards[i];
    const lifted = heldNow || scoring || liftedDuringDraw;
    const targetSlot = state.playerOrder.indexOf(i);
    const origX = CARD_COLS[i];
    const targetX = CARD_COLS[targetSlot >= 0 ? targetSlot : i];
    const cardX = origX + (targetX - origX) * revealT;
    const cy = PLAYER_Y - (lifted ? HOLD_LIFT : 0);
    const hov = state.phase === 'hold' && inRect(mouseX, mouseY, CARD_COLS[i], cy, CARD_W, CARD_H);

    const dealFlip = getDealFlipState(i);
    const replaceFade = getCardReplaceState(i, true);
    const useDealFlip = true;

    // Skip slot if a flying card is en route
    if (state.flyCards.some(fc => !fc.isDealer && fc.slotIndex === i)) {
      if (state.heldCards[i]) { /* held cards never fly, render normally */ }
      else { drawCardEmpty(CARD_COLS[i], PLAYER_Y); continue; }
    }

    // New cards stay face-down until the result reveal
    if (state.playerNewCards[i]) {
      if (!isResult) {
        // Waiting for reveal — show face-down
        drawCardBack(cardX, cy);
      } else {
        // Reveal flip in sync with dealer cards
        const { scaleX, showFace } = getNewCardRevealFlipState();
        if (Math.abs(scaleX) >= 0.03) {
          const flipCX = cardX + CARD_W / 2;
          ctx.save();
          ctx.translate(flipCX, 0); ctx.scale(scaleX, 1); ctx.translate(-flipCX, 0);
          if (showFace) drawCardFace(cardX, cy, c.char, lifted, hov, scoring);
          else drawCardBack(cardX, cy);
          ctx.restore();
        }
      }
      if (heldNow) drawHoldBadge(CARD_COLS[i], cy);
      continue;
    }

    if (useDealFlip) {
      const { scaleX, showFace } = dealFlip;
      if (Math.abs(scaleX) < 0.03) {
        // Edge-on: skip drawing (nothing visible)
      } else {
        const flipCX = cardX + CARD_W / 2;
        ctx.save();
        ctx.translate(flipCX, 0);
        ctx.scale(scaleX, 1);
        ctx.translate(-flipCX, 0);
        if (!showFace) {
          drawCardBack(cardX, cy);
        } else if (!c) {
          drawCardEmpty(cardX, cy);
        } else {
          drawCardFace(cardX, cy, c.char, lifted, hov, scoring);
        }
        ctx.restore();
      }
    }

    if (heldNow) drawHoldBadge(CARD_COLS[i], cy);
  }

  // ── (11b) Flying cards ───────────────────────────────────────────────────
  for (const fc of state.flyCards) {
    const travelProgress = Math.max(0, fc.frame - fc.startFrame);
    const t = Math.min(1, travelProgress / FLY_DUR);
    const ease = 1 - Math.pow(1 - t, 2.5);  // ease-out
    const cx = fc.sx + (fc.tx - fc.sx) * ease;
    const cy = fc.sy + (fc.ty - fc.sy) * ease;
    const x = cx - CARD_W / 2;
    const y = cy - CARD_H / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 16;

    if (fc.faceUp) {
      // Initial deal — player cards arrive face-up
      drawCardFace(x, y, fc.char, false, false, false);
    } else {
      // Draw and dealer-replacement cards fly face-down; revealed together at result
      drawCardBack(x, y);
    }
    ctx.restore();
  }

  // Hide hand rank while new cards are still face-down (would show stale pre-draw rank)
  const showPlayerRank = state.playerHandRank &&
    state.phase !== 'dealerHold' && state.phase !== 'dealerDraw';
  if (showPlayerRank) {
    ctx.font = `bold 13px ${F_GOTHIC}`;
    ctx.fillStyle = '#9eda60';
    ctx.shadowColor = '#7eb650'; ctx.shadowBlur = 6;
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText(state.playerHandRank.name, MAIN_CX, 520);
    ctx.shadowBlur = 0;
  }

  // ── (12) Controls strip ──────────────────────────────────────────────────
  const inBet = state.phase === 'bet';
  const betEditable = inBet || state.phase === 'result';
  const canAllIn = betEditable && state.bet < state.coins;
  const canDeal  = betEditable && state.coins >= 10;
  const {deal} = BTN;

  const hovAllIn = inRect(mouseX, mouseY, BW_ALLIN.x, BW_ALLIN.y, BW_ALLIN.w, BW_ALLIN.h);
  const hovDeal  = inRect(mouseX, mouseY, deal.x,     deal.y,     deal.w,     deal.h);

  // All In
  ctx.shadowColor = (hovAllIn && canAllIn) ? '#cc2222' : (canAllIn ? '#6a1010' : 'transparent');
  ctx.shadowBlur  = (hovAllIn && canAllIn) ? 12 : (canAllIn ? 4 : 0);
  rRect(BW_ALLIN.x, BW_ALLIN.y, BW_ALLIN.w, BW_ALLIN.h, 4);
  ctx.fillStyle = (hovAllIn && canAllIn) ? '#4a0e0e' : (canAllIn ? '#220606' : '#181010'); ctx.fill();
  ctx.strokeStyle = (hovAllIn && canAllIn) ? '#cc2222' : (canAllIn ? '#6a1515' : '#2e1a1a');
  ctx.lineWidth = 1.2; ctx.stroke(); ctx.shadowBlur = 0;
  ctx.font = `bold 13px ${F_GOTHIC}`;
  ctx.fillStyle = (hovAllIn && canAllIn) ? '#ffaaaa' : (canAllIn ? '#dd5555' : '#4a2828');
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('All In', BW_ALLIN.x + BW_ALLIN.w / 2, BW_ALLIN.y + BW_ALLIN.h / 2);

  // Wager value — left-aligned so number grows rightward; always gold while playing
  ctx.font = `bold 24px ${F_GOTHIC}`;
  ctx.fillStyle = state.phase !== 'gameOver' ? '#f0c860' : '#3a3022';
  ctx.shadowColor = state.phase !== 'gameOver' ? '#d4a83c' : 'transparent';
  ctx.shadowBlur = state.phase !== 'gameOver' ? 10 : 0;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(fmt(state.bet), BW_X, 545);
  ctx.shadowBlur = 0;
  ctx.font = `bold 11px ${F_GOTHIC}`;
  ctx.fillStyle = state.phase !== 'gameOver' ? '#8a7048' : '#3a3022';
  ctx.fillText('wager', BW_X, 560);

  // Percentage preset buttons — 10% / 25% / 50%
  for (const b of BW_PCT) {
    const enabled = betEditable;
    const hov = inRect(mouseX, mouseY, b.x, b.y, b.w, b.h);
    ctx.shadowColor = (hov && enabled) ? '#a07828' : 'transparent';
    ctx.shadowBlur  = (hov && enabled) ? 8 : 0;
    rRect(b.x, b.y, b.w, b.h, 4);
    ctx.fillStyle   = !enabled ? '#0a0a0c' : hov ? '#1a1206' : '#0e0e12'; ctx.fill();
    ctx.strokeStyle = !enabled ? '#1a1a1e' : hov ? '#d4a83c' : '#3a3428';
    ctx.lineWidth = 1.2; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.font = `bold 12px ${F_GOTHIC}`;
    ctx.fillStyle = !enabled ? '#252520' : hov ? '#e8c870' : '#6a6048';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }

  // Deal button
  drawDealBtn('Deal', deal.x, deal.y, deal.w, deal.h, canDeal, hovDeal && canDeal);

  // Coins
  ctx.font = `bold 13px ${F_GOTHIC}`;
  ctx.fillStyle = '#a08858';
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Coins', W-10, 537);
  ctx.font = `34px ${F_BLACKLETTER}`;
  ctx.fillStyle = '#f8d878';
  ctx.shadowColor = '#d4a83c'; ctx.shadowBlur = 18;
  ctx.fillText(fmt(state.coins), W-10, 578);
  ctx.shadowBlur = 0;

  // ── (13) Suit legend — 6 mini cards in the pay table column, bottom ──────
  {
    // Single row of 6, spanning the pay table column width (edge margin ~8px each side)
    const cw = 17, ch = 26, gap = 6;
    const rowW = CHARS.length * cw + (CHARS.length - 1) * gap;
    const rx = Math.round((PT_W - rowW) / 2);
    const ry = H - 14 - ch;  // single row near the bottom

    ctx.font = `bold 9px ${F_GOTHIC}`;
    ctx.fillStyle = '#8a7858';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Suit Values', PT_W / 2, ry - 5);

    for (let i = 0; i < CHARS.length; i++) {
      const x = rx + i * (cw + gap);
      const y = ry;
      const meta = CHAR_META[CHARS[i]];
      ctx.shadowColor = meta.color;
      ctx.shadowBlur = 6;
      rRect(x, y, cw, ch, 2);
      ctx.fillStyle = '#0e0a14'; ctx.fill();
      ctx.strokeStyle = meta.color;
      ctx.lineWidth = 1.5; ctx.stroke();
      ctx.shadowBlur = 0;
      // Suit rank number instead of dot
      ctx.shadowColor = meta.color;
      ctx.shadowBlur = 8;
      ctx.font = `bold 11px ${F_GOTHIC}`;
      ctx.fillStyle = meta.color;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(meta.suitRank, x + cw / 2, y + ch / 2);
      ctx.shadowBlur = 0;
    }
  }

  // ── (14) Win confetti ────────────────────────────────────────────────────
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ── Dealer speech bubble — bet prompt ────────────────────────────────────
  if (state.phase === 'bet') {
    const bx = 156, by = 10, bw = 208, bh = 62, br = 8;
    const ty = by + 20, th = 11;
    const tTipX = bx + bw + 46, tTipY = 46;
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.lineTo(bx + bw - br, by);
    ctx.arcTo(bx + bw, by,      bx + bw, by + br,      br);
    ctx.lineTo(bx + bw, ty - th);
    ctx.lineTo(tTipX,   tTipY);
    ctx.lineTo(bx + bw, ty + th);
    ctx.lineTo(bx + bw, by + bh - br);
    ctx.arcTo(bx + bw, by + bh, bx + bw - br, by + bh, br);
    ctx.lineTo(bx + br, by + bh);
    ctx.arcTo(bx, by + bh, bx, by + bh - br, br);
    ctx.lineTo(bx, by + br);
    ctx.arcTo(bx, by, bx + br, by, br);
    ctx.closePath();
    ctx.fillStyle = '#0d0a14'; ctx.fill();
    ctx.strokeStyle = '#5a1a28'; ctx.lineWidth = 1.5; ctx.stroke();
    rRect(bx + 5, by + 5, bw - 10, bh - 10, br - 2);
    ctx.strokeStyle = 'rgba(90,26,40,0.30)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = `bold 16px ${F_GOTHIC}`;
    ctx.fillStyle = '#d4a060';
    ctx.shadowColor = '#a07828'; ctx.shadowBlur = 8;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillText('Set thy wager...', bx + 12, by + 30);
    ctx.shadowBlur = 0;
    ctx.font = `10px ${F_GOTHIC}`;
    ctx.fillStyle = '#7a6840';
    ctx.fillText('...and deal the cards.', bx + 12, by + 48);
  }

  // ── Dealer speech bubble — "Rats!" on player victory ────────────────────
  if (state.phase === 'result' && state.resultIsWin) {
    const bx = 220, by = 8, bw = 118, bh = 44, br = 8;
    const ty = by + 14, th = 9;
    const tTipX = bx + bw + 36, tTipY = 44; // tail aimed at dealer head
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.lineTo(bx + bw - br, by);
    ctx.arcTo(bx + bw, by,      bx + bw, by + br,      br);
    ctx.lineTo(bx + bw, ty - th);
    ctx.lineTo(tTipX,   tTipY);
    ctx.lineTo(bx + bw, ty + th);
    ctx.lineTo(bx + bw, by + bh - br);
    ctx.arcTo(bx + bw, by + bh, bx + bw - br, by + bh, br);
    ctx.lineTo(bx + br, by + bh);
    ctx.arcTo(bx, by + bh, bx, by + bh - br, br);
    ctx.lineTo(bx, by + br);
    ctx.arcTo(bx, by, bx + br, by, br);
    ctx.closePath();
    ctx.fillStyle = '#0d0a14'; ctx.fill();
    ctx.strokeStyle = '#5a1a28'; ctx.lineWidth = 1.5; ctx.stroke();
    rRect(bx + 5, by + 5, bw - 10, bh - 10, br - 2);
    ctx.strokeStyle = 'rgba(90,26,40,0.30)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = `bold 22px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#e06070';
    ctx.shadowColor = '#c04050'; ctx.shadowBlur = 10;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Rats!', bx + bw / 2, by + bh / 2);
    ctx.shadowBlur = 0;
  }

  // ── Game Over overlay ────────────────────────────────────────────────────
  if (state.phase === 'gameOver') {
    // Dark veil over the entire felt area (cards + pay table) — makes the button glow
    ctx.fillStyle = 'rgba(2,1,4,0.78)';
    ctx.fillRect(0, TABLE_FELT_Y, W, H - TABLE_FELT_Y);

    // Dealer hands float above the veil
    drawDealerHandsOnFelt();

    // ── Speech bubble — dealer says "You have perished..." ────────────────
    // Positioned in the graveyard sky, top-left of the dealer's head.
    // Dealer head is centred at roughly (474, 47); bubble sits to its left.
    const bx = 156, by = 10, bw = 208, bh = 62, br = 8;
    const ty = by + 20, th = 11;             // tail anchor on the right edge
    const tTipX = bx + bw + 46, tTipY = 46; // tip aimed at dealer head
    ctx.beginPath();
    ctx.moveTo(bx + br, by);
    ctx.lineTo(bx + bw - br, by);
    ctx.arcTo(bx + bw, by,      bx + bw, by + br,      br);
    ctx.lineTo(bx + bw, ty - th);
    ctx.lineTo(tTipX,   tTipY);
    ctx.lineTo(bx + bw, ty + th);
    ctx.lineTo(bx + bw, by + bh - br);
    ctx.arcTo(bx + bw, by + bh, bx + bw - br, by + bh, br);
    ctx.lineTo(bx + br, by + bh);
    ctx.arcTo(bx, by + bh, bx, by + bh - br, br);
    ctx.lineTo(bx, by + br);
    ctx.arcTo(bx, by, bx + br, by, br);
    ctx.closePath();
    ctx.fillStyle = '#0d0a14'; ctx.fill();
    ctx.strokeStyle = '#5a1a28'; ctx.lineWidth = 1.5; ctx.stroke();
    // Inner frame
    rRect(bx + 5, by + 5, bw - 10, bh - 10, br - 2);
    ctx.strokeStyle = 'rgba(90,26,40,0.30)'; ctx.lineWidth = 1; ctx.stroke();
    // Bubble text
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.font = `bold 16px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#e06070';
    ctx.shadowColor = '#c04050'; ctx.shadowBlur = 10;
    ctx.fillText('You have perished...', bx + 12, by + 30);
    ctx.shadowBlur = 0;
    ctx.font = `10px ${F_GOTHIC}`;
    ctx.fillStyle = '#7a5060';
    ctx.fillText('Your coins have run dry.', bx + 12, by + 48);

    // ── Begin Anew button — centred in the action strip, glowing ─────────
    const gb = GAMEOVER_BTN;
    const hovGB = inRect(mouseX, mouseY, gb.x, gb.y, gb.w, gb.h);
    ctx.shadowColor = hovGB ? '#e8c870' : '#b08030';
    ctx.shadowBlur = hovGB ? 28 : 14;
    rRect(gb.x, gb.y, gb.w, gb.h, 6);
    ctx.fillStyle = hovGB ? '#3a2206' : '#1e1406'; ctx.fill();
    ctx.strokeStyle = hovGB ? '#e8c870' : '#a07028'; ctx.lineWidth = 2; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = `bold 21px ${F_GOTHIC}`;
    ctx.fillStyle = hovGB ? '#fff4c8' : '#e0c070';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Begin Anew', gb.x + gb.w / 2, gb.y + gb.h / 2);

    // ── High score — to the right of Begin Anew, vertically centred with it ─
    // Button right edge: gb.x + gb.w = MAIN_CX + 80 = 554; canvas right = 800
    const hx = Math.round((gb.x + gb.w + W) / 2);  // centre of remaining space (~677)
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.font = `12px ${F_GOTHIC}`;
    ctx.fillStyle = '#8a7048';
    ctx.fillText('Highest coinage', hx, gb.y + gb.h / 2 - 6);
    ctx.font = `bold 26px ${F_BLACKLETTER}`;
    ctx.fillStyle = '#e8c068';
    ctx.shadowColor = '#b08828'; ctx.shadowBlur = 10;
    ctx.fillText(fmt(state.highCoinCount), hx, gb.y + gb.h / 2 + 18);
    ctx.shadowBlur = 0;
  }
}

// ── Update + Loop ──────────────────────────────────────────────────────────
function update() {
  state.animFrame++;
  handleClicks();
  updateCursor();

  if (state.phase === 'hold' && state.playerCards.length === 5) {
    state.playerHandRank = evaluateHand(state.playerCards);
  }

  if ((state.phase === 'hold' || state.phase === 'playerDraw' || state.phase === 'dealerHold' || state.phase === 'dealerDraw') &&
      state.dealFlipFrame < DEAL_FLIP_STAGGER * 4 + DEAL_FLIP_HALF * 2 + 5) {
    state.dealFlipFrame++;
  }

  if (state.dealerAnim !== 'idle') {
    state.dealerAnimFrame++;
    if (state.dealerAnim === 'dealing'   && state.dealerAnimFrame >= 60) { state.dealerAnim='idle'; state.dealerAnimFrame=0; }
    if (state.dealerAnim === 'revealing' && state.dealerAnimFrame >= 84) { state.dealerAnim='idle'; state.dealerAnimFrame=0; }
  }

  // Dealer's hold phase: each chosen card raises one-by-one over 3 seconds.
  if (state.phase === 'dealerHold') {
    state.dealerHoldFrame++;
    for (let i = 0; i < 5; i++) {
      if (state.dealerHeld[i] && state.dealerHoldFrame === 30 + i * 25) sfxHold();
    }
    if (state.dealerHoldFrame >= DEALER_HOLD_DUR) {
      doDealerFly();
      state.phase = 'dealerDraw';
    }
  }

  // Flying card animation — runs for initialDeal, playerDraw, and dealerDraw phases.
  if (state.phase === 'initialDeal' || state.phase === 'playerDraw' || state.phase === 'dealerDraw') {
    let allDone = true;
    for (const fc of state.flyCards) {
      fc.frame++;
      if (!fc.landed && (fc.frame - fc.startFrame) >= FLY_DUR) fc.landed = true;
      if (!fc.landed) allDone = false;
    }
    if (allDone) {
      state.flyCards = [];
      if (state.phase === 'initialDeal') {
        // Cards have landed face-up — evaluate the hand and let the player choose
        state.playerHandRank = evaluateHand(state.playerCards);
        state.phase = 'hold';
      } else if (state.phase === 'playerDraw') {
        doStartDealerHold();
        state.phase = 'dealerHold';
      } else {
        doFinalizeReveal();
        doResolve();
        state.dealerRevealFlipFrame = 0;
        state.phase = 'result';
      }
    }
  }

  if (state.phase === 'result') {
    if (state.revealFrame < REVEAL_DUR) state.revealFrame++;
    if (state.revealFrame >= REVEAL_DUR && state.brokeAfterResult) {
      state.phase = 'gameOver';
    }
    if (state.dealerRevealFlipFrame < DEAL_FLIP_STAGGER * 4 + DEAL_FLIP_HALF * 2 + 10) {
      state.dealerRevealFlipFrame++;
    }
  }

  // Win confetti physics
  for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.09; p.life--; }
  particles = particles.filter(p => p.life > 0);

  // Ambient embers
  for (const p of ambient) {
    p.x += p.vx; p.y += p.vy;
    if (p.y < -8) { p.y = TABLE_TOP_Y + 6; p.x = Math.random()*W; }
    if (p.x < -6) p.x = W;
    if (p.x > W+6) p.x = 0;
  }

  // Crows: spawn occasionally + advance
  if (Math.random() < 0.0035 && crows.length < 4) spawnCrow();
  for (const c of crows) {
    c.x += c.vx; c.y += c.vy; c.flap += c.flapSpeed;
  }
  for (let i=crows.length-1; i>=0; i--) {
    const c = crows[i];
    if ((c.dir > 0 && c.x > W + 24) || (c.dir < 0 && c.x < -24)) crows.splice(i, 1);
  }
}

function loop() { update(); render(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
